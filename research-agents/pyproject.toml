[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sheperd-research-agents"
version = "0.1.0"
description = "Evidence-bound maritime research agents for SheperD"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langchain>=1.0",
  "langchain-openai>=0.3.9",
  "langchain-tavily>=0.2",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "uvicorn>=0.34",
]

[project.scripts]
sheperd-research = "sheperd_research.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sheperd_research"]

[tool.vercel]
entrypoint = "src.app:app"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
