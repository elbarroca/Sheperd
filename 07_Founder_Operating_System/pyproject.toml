[project]
name = "sheperd-founder-operating-system"
version = "0.1.0"
description = "Local evidence-controlled query and decision workspace for SheperD founders"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
